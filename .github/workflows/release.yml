name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC, for both trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Node 24 for the npm it bundles, not for the runtime: trusted publishing needs npm 11.5.1
      # or later, and no Node 22 release ever shipped one -- 22.23.1 carries npm 10.9.8, which has
      # no OIDC support and fails with ENEEDAUTH. Node 24.5.0 was the first with 11.5.1. The
      # package still supports Node 20; that floor is what the CI matrix covers.
      #
      # No `cache: npm` here, per npm's trusted-publishing guidance for release builds, and no
      # NODE_AUTH_TOKEN: the OIDC exchange is the credential, and a token in the environment
      # displaces it.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm publish
